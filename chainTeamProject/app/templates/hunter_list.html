{# hunter_list.html #}
{% extends "base.html" %}
{% block title %}헌터 목록{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>헌터 목록</h2>
    <a href="{{ url_for('main.hunter_new') }}" class="btn btn-primary">헌터 등록</a>
</div>

<table class="table table-hover">
    <thead>
    <tr>
        <th>ID</th><th>이름</th><th>상태</th><th>팀</th><th>지역</th>
    </tr>
    </thead>
    <tbody>
    {% for h in hunters %}
    <tr>
        <td><a href="{{ url_for('main.hunter_detail', hunter_id=h.hunter_id) }}">{{ h.hunter_id }}</a></td>
        <td>{{ h.name }}</td>
        <td>{{ h.status }}</td>
        <td>{{ h.team_name or '-' }}</td>
        <td>{{ h.region or '-' }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
