{% extends "base.html" %}
{% block title %}헌터 목록{% endblock %}

{% block content %}
<h2 class="mb-3">헌터 목록</h2>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>#</th>
        <th>이름</th>
        <th>상태</th>
        <th>소속 팀</th>
        <th>상세</th>
    </tr>
    </thead>
    <tbody>
    {% for h in hunters %}
    <tr>
        <td>{{ h.id }}</td>
        <td>{{ h.name }}</td>
        <td>{{ h.status }}</td>
        <td>{{ h.team_name or '-' }}</td>
        <td>
            <a class="btn btn-sm btn-outline-secondary"
               href="{{ url_for('main.hunter_detail', hunter_id=h.id) }}">
                보기
            </a>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="5" class="text-muted">등록된 헌터가 없습니다.</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
