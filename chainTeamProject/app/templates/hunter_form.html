{# hunter_form.html #}
{% extends "base.html" %}
{% block title %}헌터 등록{% endblock %}
{% block content %}
<h2>헌터 등록</h2>
<form method="post">
    <div class="mb-3">
        <label class="form-label">이름</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="alert alert-info">
        <strong>팀 배정 안내</strong><br>
        • 팀은 자동으로 랜덤 배정됩니다.
    </div>

    <button class="btn btn-success">등록</button>
    <a href="{{ url_for('main.hunter_list') }}" class="btn btn-secondary">취소</a>
</form>
{% endblock %}
