{% extends "base.html" %}
{% block title %}전투 기록 등록{% endblock %}
{% block content %}
<h2>전투 기록 등록</h2>

<form method="post">
    <div class="mb-3">
        <label class="form-label"><strong>미션 선택</strong></label>
        <select name="mission_id" id="mission_select" class="form-select" required>
            <option value="">미션을 선택하세요</option>
            {% for m in missions %}
            <option value="{{ m.mission_id }}">
                미션 {{ m.mission_id }} - {{ m.objective }} ({{ m.team_name or '팀 없음' }}) [{{ m.state }}]
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label"><strong>대상 악마</strong></label>
        <select name="demon_id" class="form-select" required>
            <option value="">악마를 선택하세요</option>
            {% for d in demons %}
            <option value="{{ d.demon_id }}">
                {{ d.name }} - 등급: {{ d.grade }} | 현상금: {{ "{:,}".format(d.bounty) }}원 | 상태: {{ d.status }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label"><strong>전투 결과</strong></label>
        <select name="outcome" class="form-select" required>
            <option value="">선택하세요</option>
            <option value="HUNTER_WIN">HUNTER_WIN (헌터 승리 - 악마 DEAD 처리)</option>
            <option value="DEMON_WIN">DEMON_WIN (악마 승리)</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label"><strong>전투 장소</strong></label>
        <input type="text" name="location" class="form-control" required
               placeholder="예: 도쿄, 신주쿠">
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">민간인 사망자 수</label>
            <input type="number" name="civilian_killed" class="form-control" min="0" value="0" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">민간인 부상자 수</label>
            <input type="number" name="civilian_injured" class="form-control" min="0" value="0" required>
        </div>
    </div>

    <div class="mb-3" id="hunters_section" style="display: none;">
        <label class="form-label"><strong>사망 헌터 선택 (현상금 분배 제외)</strong></label>
        <div id="hunters_list" class="border rounded p-3">
            <p class="text-muted">미션을 먼저 선택하세요.</p>
        </div>
    </div>

    <div class="alert alert-warning">
        <strong>⚠️ 중요 안내</strong><br>
        • <strong>HUNTER_WIN 선택 시:</strong> 대상 악마가 자동으로 DEAD 상태로 변경되고, 민간인 사망자수/부상자수가 악마에게 반영 됩니다.<br>
        • <strong>사망 헌터 선택 시:</strong> 사망한 헌터는 현상금 분배에서 제외됩니다.<br>
    </div>

    <button class="btn btn-success btn-lg">전투 기록 등록</button>
    <a href="{{ url_for('main.battle_list') }}" class="btn btn-secondary btn-lg">취소</a>
</form>

<script>
let allHunters = [];

// 페이지 로드 완료 후 실행
document.addEventListener('DOMContentLoaded', function() {
    const missionSelect = document.getElementById('mission_select');
    if (missionSelect) {
        missionSelect.addEventListener('change', loadHunters);
        
        // 페이지 로드 시 이미 미션이 선택되어 있으면 헌터 목록 로드
        if (missionSelect.value) {
            loadHunters();
        }
    }
});

function loadHunters() {
    const missionId = document.getElementById('mission_select').value;
    const huntersSection = document.getElementById('hunters_section');
    const huntersList = document.getElementById('hunters_list');
    
    allHunters = [];
    
    if (!missionId) {
        if (huntersSection) huntersSection.style.display = 'none';
        return;
    }
    
    console.log('Loading hunters for mission:', missionId);
    
    // AJAX로 팀원 목록 가져오기
    fetch(`/missions/${missionId}/hunters`)
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('Hunters data:', data);
            if (data.hunters && data.hunters.length > 0) {
                allHunters = data.hunters;
                if (huntersSection) {
                    huntersSection.style.display = 'block';
                    huntersSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                renderHuntersList();
            } else {
                if (huntersSection) huntersSection.style.display = 'block';
                if (huntersList) {
                    huntersList.innerHTML = '<p class="text-muted">이 미션에 할당된 ALIVE 팀원이 없습니다.</p>';
                }
            }
        })
        .catch(error => {
            console.error('Error loading hunters:', error);
            if (huntersSection) huntersSection.style.display = 'block';
            if (huntersList) {
                huntersList.innerHTML = '<p class="text-danger">팀원 목록을 불러올 수 없습니다. 오류: ' + error.message + '</p>';
            }
        });
}

function renderHuntersList() {
    const huntersList = document.getElementById('hunters_list');
    if (!huntersList) {
        console.error('hunters_list element not found');
        return;
    }
    
    if (allHunters.length === 0) {
        huntersList.innerHTML = '<p class="text-muted">헌터가 없습니다.</p>';
        return;
    }
    
    // 모든 헌터를 자동으로 참여 헌터로 처리 (hidden input)
    let html = '<div class="mb-3">';
    allHunters.forEach(hunter => {
        html += `<input type="hidden" name="participant_hunters" value="${hunter.hunter_id}">`;
    });
    html += '</div>';
    
    html += '<div class="table-responsive">';
    html += '<table class="table table-bordered table-hover table-sm">';
    html += '<thead class="table-light"><tr><th style="width: 60%">헌터 이름</th><th style="width: 40%" class="text-center">💀 사망 헌터</th></tr></thead>';
    html += '<tbody>';
    
    allHunters.forEach(hunter => {
        html += `
            <tr>
                <td>
                    <strong>${hunter.name || '이름 없음'}</strong><br>
                    <small class="text-muted">ID: ${hunter.hunter_id}</small>
                </td>
                <td class="text-center align-middle">
                    <input class="form-check-input dead-check" type="checkbox" 
                           name="dead_hunters" 
                           value="${hunter.hunter_id}" 
                           id="dead_${hunter.hunter_id}">
                    <label class="form-check-label text-danger fw-bold ms-1" for="dead_${hunter.hunter_id}">
                        사망
                    </label>
                </td>
            </tr>
        `;
    });
    
    huntersList.innerHTML = html;
    console.log('Hunters list rendered:', allHunters.length, 'hunters');
}
</script>
{% endblock %}
