{% extends "base.html" %}
{% block title %}임무 할당{% endblock %}

{% block content %}
<h2 class="mb-3">임무 할당 등록</h2>

<form method="post" class="card p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label for="mission_id" class="form-label">임무</label>
        <select class="form-select" id="mission_id" name="mission_id" required>
            <option value="" selected disabled>임무를 선택하세요</option>
            {% for m in missions %}
            <option value="{{ m.id }}">{{ m.id }} - {{ m.title }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="team_id" class="form-label">팀</label>
        <select class="form-select" id="team_id" name="team_id" required>
            <option value="" selected disabled>팀을 선택하세요</option>
            {% for t in teams %}
            <option value="{{ t.id }}">
                {{ t.id }} - {{ t.name }} ({{ t.region }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">할당 상태</label>
        <select class="form-select" id="status" name="status">
            <option value="PLANNED">PLANNED</option>
            <option value="CONFIRMED" selected>CONFIRMED</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="DONE">DONE</option>
            <option value="CANCELLED">CANCELLED</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">임무 할당</button>
    <a href="{{ url_for('main.assignment_list') }}" class="btn btn-secondary">목록</a>
</form>
{% endblock %}
