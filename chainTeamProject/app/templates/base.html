<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Devil Hunter System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">Devil Hunter</a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('main.devil_risk_page') }}">악마 위험도</a>
            <a class="nav-link" href="{{ url_for('main.battle_list') }}">전투 기록</a>
            <a class="nav-link" href="{{ url_for('main.mission_list') }}">임무 관리</a>
            <a class="nav-link" href="{{ url_for('main.hunter_list') }}">헌터 목록</a>

            <!-- 임무 할당 기능 추가 -->
            <a class="nav-link" href="{{ url_for('main.assignment_list') }}">임무 할당 목록</a>
            <a class="nav-link" href="{{ url_for('main.assignment_new') }}">임무 할당 등록</a>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
